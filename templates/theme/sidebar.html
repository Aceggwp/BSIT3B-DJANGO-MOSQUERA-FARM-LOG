<aside class="navbar navbar-vertical navbar-expand-lg navbar-dark dh-sidebar dh-sidebar-dark">
  <div class="container-fluid p-0">
    <!-- Brand mark (icon-only, flat vector) -->
    <div class="navbar-brand dh-brand-dark text-center py-4 px-2 border-bottom border-neon">
      <a href="{% url 'farm:dashboard' %}" class="d-flex flex-column align-items-center gap-1 text-decoration-none" title="Go to Farm Dashboard" aria-label="MOSQUERA Farm Logs — Farm Dashboard">
        <span class="dh-brand-mark dh-brand-leaf d-inline-flex">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width:1.6rem;height:1.6rem;">
            <path d="M12 2C7.5 7 4.5 11.5 4.5 15.5a7.5 7.5 0 0 0 7.5 7.5c4 0 7.5-3.5 7.5-7.5C19.5 11 16.5 6.5 12 2Z" fill="var(--tblr-primary)"/>
            <path d="M12 5.5V20M12 10l-3.5-2M12 13.5 8 12M12 13.5l4-1.5M12 10l3.5-2" stroke="#a855f7" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
      </a>
    </div>

    <!-- Icon-only navigation -->
    <ul class="navbar-nav flex-fill pt-2">
      <!-- Users (superuser only) -->
      {% if user.is_superuser %}
      <li class="nav-item">
        <a class="nav-link nav-link-dark {% if request.resolver_match.app_name == 'users' %}active{% endif %}" href="{% url 'users:user_list' %}" title="Users" data-bs-toggle="tooltip" data-bs-placement="right">
          <span class="nav-link-icon-wrap"><i class="fas fa-users"></i></span>
        </a>
      </li>
      {% endif %}

      <!-- Farm Dashboard -->
      <li class="nav-item">
        <a class="nav-link nav-link-dark nav-link-farm {% if request.resolver_match.namespace == 'farm' and request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'farm:dashboard' %}" title="Farm Dashboard" data-bs-toggle="tooltip" data-bs-placement="right">
          <span class="nav-link-icon-wrap"><i class="fas fa-seedling"></i></span>
        </a>
      </li>

      <!-- Plants -->
      <li class="nav-item">
        <a class="nav-link nav-link-dark nav-link-farm {% if request.resolver_match.namespace == 'farm' and request.resolver_match.url_name == 'plant_list' or request.resolver_match.namespace == 'farm' and request.resolver_match.url_name == 'plant_detail' %}active{% endif %}" href="{% url 'farm:plant_list' %}" title="Plants" data-bs-toggle="tooltip" data-bs-placement="right">
          <span class="nav-link-icon-wrap"><i class="fas fa-leaf"></i></span>
          <span class="nav-badge {% if not nav_plant_count %}d-none{% endif %}" id="nav-badge-plants">{{ nav_plant_count|default:"" }}</span>
        </a>
      </li>

      <!-- Reminders -->
      <li class="nav-item">
        <a class="nav-link nav-link-dark nav-link-farm {% if request.resolver_match.namespace == 'farm' and request.resolver_match.url_name == 'reminder_list' %}active{% endif %}" href="{% url 'farm:reminder_list' %}" title="Reminders" data-bs-toggle="tooltip" data-bs-placement="right">
          <span class="nav-link-icon-wrap"><i class="fas fa-bell"></i></span>
          <span class="nav-badge {% if not nav_due_count %}d-none{% endif %}" id="nav-badge-due">{{ nav_due_count|default:"" }}</span>
        </a>
      </li>

      <!-- Care Logs -->
      <li class="nav-item">
        <a class="nav-link nav-link-dark nav-link-farm {% if request.resolver_match.namespace == 'farm' and request.resolver_match.url_name == 'carelog_list' %}active{% endif %}" href="{% url 'farm:carelog_list' %}" title="Care Logs" data-bs-toggle="tooltip" data-bs-placement="right">
          <span class="nav-link-icon-wrap"><i class="fas fa-book"></i></span>
        </a>
      </li>

      <!-- Garden Map -->
      <li class="nav-item">
        <a class="nav-link nav-link-dark nav-link-farm {% if request.resolver_match.namespace == 'farm' and request.resolver_match.url_name == 'map' %}active{% endif %}" href="{% url 'farm:map' %}" title="Garden Map" data-bs-toggle="tooltip" data-bs-placement="right">
          <span class="nav-link-icon-wrap"><i class="fas fa-map"></i></span>
        </a>
      </li>

      <!-- Garden Areas -->
      <li class="nav-item">
        <a class="nav-link nav-link-dark nav-link-farm {% if request.resolver_match.namespace == 'farm' and request.resolver_match.url_name == 'area_list' %}active{% endif %}" href="{% url 'farm:area_list' %}" title="Garden Areas" data-bs-toggle="tooltip" data-bs-placement="right">
          <span class="nav-link-icon-wrap"><i class="fas fa-border-all"></i></span>
        </a>
      </li>
    </ul>

    <!-- Bottom controls: settings + avatar, stacked vertically with equal gaps -->
    <div class="dh-sidebar-bottom mt-auto">
      <a
        href="#"
        class="dh-settings-trigger"
        data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasSettings"
        aria-controls="offcanvasSettings"
        aria-label="Theme settings"
        title="Theme settings"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </a>
      {% if user.is_authenticated %}
      <a href="{% url 'logout' %}" class="dh-user-avatar-link dh-logout-trigger" title="Log out" aria-label="Log out">
        <span class="dh-avatar-dark">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
            <path d="M9 12h12l-3 -3" />
            <path d="M18 15l3 -3" />
          </svg>
        </span>
      </a>
      {% endif %}
    </div>

  </div>
</aside>
